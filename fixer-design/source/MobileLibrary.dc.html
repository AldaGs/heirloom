<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixer — Library (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F0F10}
a{color:#F0A43A}a:hover{color:#FFC777}
button{font-family:inherit;cursor:pointer}
.chips::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; background: #0F0F10; color: #ECEAE6; font-family: Inter, system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column; overflow: hidden">

<header style="flex: none; padding: 16px 16px 8px; display: flex; align-items: center; gap: 4px">
  <h1 style="margin: 0; flex: 1; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">Library</h1>
  <span style="display: flex; align-items: center; gap: 6px; color: #9A9AA3; font-size: 12px; margin-right: 4px">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M7 18a5 5 0 1 1 1-9.9A6 6 0 0 1 19 10a4 4 0 0 1-1 8z"></path><path d="M9.5 13.5l2 2 3.5-3.5"></path></svg>
    Synced
  </span>
  <button aria-label="Search" style="width: 44px; height: 44px; border: 0; background: transparent; color: #ECEAE6; display: grid; place-items: center">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
  </button>
  <button aria-label="Filter and sort" style="width: 44px; height: 44px; border: 0; background: transparent; color: #ECEAE6; display: grid; place-items: center">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
  </button>
</header>

<div class="chips" role="tablist" aria-label="Albums" style="flex: none; height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 16px; overflow-x: auto">
  <sc-for list="{{albums}}" as="a" hint-placeholder-count="5">
    <button role="tab" aria-selected="{{a.selected}}" onClick="{{a.pick}}" style="flex: none; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid {{a.border}}; background: {{a.bg}}; color: {{a.fg}}; font-size: 13px; font-weight: 600">{{a.name}}</button>
  </sc-for>
</div>

<div style="flex: none; padding: 4px 16px 8px; display: flex; justify-content: space-between; color: #9A9AA3; font-size: 12px">
  <span>Today</span><span>Sorted by capture date</span>
</div>

<div style="flex: 1 1 auto; overflow-y: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; align-content: start; padding-bottom: 96px">
  <sc-for list="{{thumbs}}" as="t" hint-placeholder-count="18">
    <a href="MobileDevelop.dc.html" aria-label="{{t.label}}" style="position: relative; display: block; aspect-ratio: 1 / 1; background: {{t.bg}}">
      <sc-if value="{{t.edited}}" hint-placeholder-val="{{ false }}">
        <span aria-hidden="true" style="position: absolute; right: 6px; top: 6px; width: 20px; height: 20px; border-radius: 10px; background: rgba(15,15,16,0.75); display: grid; place-items: center">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#F0A43A" stroke-width="2.5"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path></svg>
        </span>
      </sc-if>
      <sc-if value="{{t.starred}}" hint-placeholder-val="{{ false }}">
        <span aria-hidden="true" style="position: absolute; left: 6px; bottom: 4px; color: #F0A43A; font-size: 12px; text-shadow: 0 1px 2px rgba(0,0,0,0.8)">★</span>
      </sc-if>
    </a>
  </sc-for>
</div>

<button aria-label="Import photos" style="position: absolute; right: 20px; bottom: 96px; width: 56px; height: 56px; border-radius: 28px; border: 0; background: #F0A43A; color: #1A1206; display: grid; place-items: center; box-shadow: 0 6px 20px rgba(0,0,0,0.5)">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 8px; box-sizing: border-box; border-top: 1px solid #2A2A2F; background: #141416">
  <a href="#" aria-current="page" style="width: 72px; height: 52px; color: #F0A43A; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 16l-5-5-9 10"></path></svg>
    Photos
  </a>
  <a href="#" style="width: 72px; height: 52px; color: #9A9AA3; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M3 7h6l2 2h10v10H3z"></path></svg>
    Albums
  </a>
  <a href="#" style="width: 72px; height: 52px; color: #9A9AA3; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1"></rect><rect x="13" y="3" width="8" height="8" rx="1"></rect><rect x="3" y="13" width="8" height="8" rx="1"></rect><rect x="13" y="13" width="8" height="8" rx="1"></rect></svg>
    Presets
  </a>
  <a href="#" style="width: 72px; height: 52px; color: #9A9AA3; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"></path></svg>
    Settings
  </a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var LIB_ALBUMS = ['All photos', 'Picks', 'Edited', 'Raw only', 'Shared'];
var LIB_COLORS = ['#22325A,#D9845E','#3A5F4A,#C9B27A','#2A2A3A,#8A6A9A','#5A7BA8,#E8D9C0','#1E1E22,#6B6B70','#7A3A2A,#E0A060','#2F4F6F,#9FC0D0','#4A3A2A,#C08A5A','#203040,#5070A0','#5A4A6A,#E0B0A0','#2A3A2A,#90A070','#3A2A3A,#D06070','#40506A,#C0A890','#1A2A3A,#7090B0','#6A5A3A,#E0C080','#2A2030,#A07090','#304030,#B0C090','#503030,#E09070','#20283A,#A0B0D0','#3A3A2A,#C0B070','#2A3A4A,#80A0A0'];
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { album: 'All photos' }; }
  renderVals() {
    var self = this, al = this.state.album;
    var all = LIB_COLORS.map(function (c, i) {
      return { i: i, bg: 'linear-gradient(180deg,' + c + ')', edited: i % 3 === 0, starred: i % 4 === 1 || i === 0, label: 'Photo ' + (i + 1) + ', open in editor' };
    });
    var shown = al === 'Picks' ? all.filter(function (t) { return t.starred; })
      : al === 'Edited' ? all.filter(function (t) { return t.edited; })
      : al === 'Raw only' ? all.filter(function (t) { return t.i % 2 === 0; })
      : al === 'Shared' ? all.slice(0, 4) : all;
    return {
      thumbs: shown,
      albums: LIB_ALBUMS.map(function (n) {
        var on = n === al;
        return { name: n, selected: on ? 'true' : 'false', bg: on ? '#ECEAE6' : 'transparent', fg: on ? '#0F0F10' : '#C9C7C2', border: on ? '#ECEAE6' : '#2A2A2F',
          pick: function () { self.setState({ album: n }); } };
      })
    };
  }
}
</script>
</body>
</html>
